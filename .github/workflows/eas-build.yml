name: EAS Build

# Starts an EAS Android preview build (installable APK) after CI passes on main.
# Download the APK from the build page on expo.dev. Nothing is uploaded to the
# Play Store.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify Expo project access without starting a build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Automatic runs only follow a green CI push to main, never a PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit CI validated, not whatever main moved to.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check EXPO_TOKEN
        run: test -n "$EXPO_TOKEN" || { echo "::error::Add an EXPO_TOKEN repository secret"; exit 1; }
      - name: Verify Expo project access
        run: |
          if ! npx eas-cli project:info; then
            echo "::error::EXPO_TOKEN must have access to the owner and EAS project configured in app.json. Update the repository secret for the current Expo account."
            exit 1
          fi
      # --no-wait queues the build on EAS and returns, so runner minutes are
      # not spent waiting; the build page link is in the log.
      - name: Start Android build
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait
          {
            echo "Started the **preview** Android build."
            echo "Open expo.dev, then the Yume project, then Builds, and install the APK when it finishes."
          } >> "$GITHUB_STEP_SUMMARY"
