name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 (the test harness's SQLite engine) requires Node >=22;
          # on Node 20 its native addon segfaults the Jest workers. Local dev is
          # on 24 — 22 is the LTS floor that satisfies every dependency.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
